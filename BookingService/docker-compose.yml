version: '3.8'

services:
  booking-postgres:
    container_name: booking_postgres
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: booking_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - booking-postgres-data:/var/lib/postgresql/data
    networks:
      - booking-network

  seq:
    container_name: seq_logger
    image: datalust/seq:latest
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true 
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data
    networks:
      - booking-network

volumes:
  booking-postgres-data:
  auth-postgres-data:
  seq-data:

networks:
  booking-network:
    driver: bridge