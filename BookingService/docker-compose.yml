services:
  gateway-api:
    container_name: gateway_api
    image: bookingservice-gateway-api
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__Redis=redis:6379
      - ConnectionStrings__DefaultConnection=Host=booking_postgres;Port=5432;Database=booking_service_db;Username=postgres;Password=postgres
      - ConnectionStrings__AuthConnection=Host=auth_postgres;Port=5432;Database=auth_db;Username=postgres;Password=postgres
      - ConnectionStrings__NotificationConnection=Host=notification_postgres;Port=5432;Database=notification_db;Username=postgres;Password=postgres
      - SmtpSettings__Host=mailpit
    depends_on:
      - booking-postgres
      - auth_postgres
      - notification-postgres
      - mailpit
      - redis
    networks:
      - booking-network

  booking-postgres:
    container_name: booking_postgres
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: booking_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - booking-postgres-data:/var/lib/postgresql/data
    networks:
      - booking-network

  auth_postgres:
    container_name: auth_postgres
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    networks:
      - booking-network

  notification-postgres:
    container_name: notification_postgres
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5437:5432"
    volumes:
      - notification-postgres-data:/var/lib/postgresql/data
    networks:
      - booking-network

  mailpit:
    container_name: mailpit
    image: axllent/mailpit:latest
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - booking-network

  redis:
    container_name: redis_cache
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - booking-network

  seq:
    container_name: seq_logger
    image: datalust/seq:latest
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data
    networks:
      - booking-network

volumes:
  booking-postgres-data:
  auth-postgres-data:
  notification-postgres-data:
  seq-data:
  redis-data:

networks:
  booking-network:
    driver: bridge