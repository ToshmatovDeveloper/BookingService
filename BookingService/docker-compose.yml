services:
  gateway.api:
    container_name: gateway_api
    restart: always
    build:
      context: .
      dockerfile: src/BookingService.Web/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
    networks:
      - booking-network
  
  booking-postgres:
    container_name: booking_postgres
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: booking_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - booking-postgres-data:/var/lib/postgresql/data
    networks:
      - booking-network

  seq:
    container_name: seq_logger
    image: datalust/seq:latest
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data
    networks:
      - booking-network

volumes:
  booking-postgres-data:
  seq-data:

networks:
  booking-network:
    driver: bridge